name: Release

# Push a tag like v0.9.2 to:
#   - create a draft GitHub release with the foss APK (signed with the release key)
#   - upload the play AAB to Play production as a draft (signed with the upload key)
# Both are drafts: write GitHub notes and publish each one manually.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag, version and Play changelog
        id: version
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -m1 -oP 'versionName = "\K[0-9][^"]*' app/build.gradle.kts)
          VERSION_CODE=$(grep -m1 -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          CHANGELOG="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"

          echo "Tag: $GITHUB_REF_NAME | versionName: $VERSION_NAME | versionCode: $VERSION_CODE"

          if [ "$GITHUB_REF_NAME" != "v${VERSION_NAME}" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match versionName 'v${VERSION_NAME}' in app/build.gradle.kts"
            exit 1
          fi
          if [ ! -s "$CHANGELOG" ]; then
            echo "::error::Missing or empty Play changelog: $CHANGELOG"
            exit 1
          fi
          CHARS=$(python3 -c 'import sys; print(len(open(sys.argv[1], encoding="utf-8").read().strip()))' "$CHANGELOG")
          if [ "$CHARS" -gt 500 ]; then
            echo "::error::$CHANGELOG is $CHARS characters; Play allows at most 500"
            exit 1
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

  github-release:
    name: GitHub release (draft)
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION_NAME: ${{ needs.validate.outputs.version_name }}
      # SHA-256 of the release key (radio-app-signing.jks / radio-signing).
      # Same cert as previous GitHub releases, so users can update in place.
      EXPECTED_CERT_SHA256: cea0d7863936fda44846d3701f47076ee5b0c7fef337712d1785a98795fbba95
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -di > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build foss APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleFossRelease

      - name: Verify signature and rename APK
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/foss/release/*.apk | head -n1)
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)apksigner"

          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"
          if ! echo "$CERTS" | grep -q "certificate SHA-256 digest: $EXPECTED_CERT_SHA256"; then
            echo "::error::APK is not signed with the expected release key"
            exit 1
          fi

          OUT="internetradio-v${VERSION_NAME}.apk"
          mv "$APK" "$OUT"
          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Release notes are written manually on GitHub before publishing.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; replacing APK only (notes untouched)."
            gh release upload "$GITHUB_REF_NAME" "$APK_PATH" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --notes ""
          fi

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  play-release:
    name: Play Store production (draft)
    needs: validate
    runs-on: ubuntu-latest
    env:
      # SHA-256 of the upload key (radio-upload.jks / radio-upload).
      EXPECTED_CERT_SHA256: E6:95:1A:27:C5:2A:AE:3A:F8:AB:69:08:39:BB:FB:56:7A:64:A8:AE:FE:43:18:55:2A:68:CE:76:54:F4:03:AA
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_OPT_OUT_USAGE: 'YES'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Ruby (fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Decode upload keystore and Play key
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -di > "$RUNNER_TEMP/upload.jks"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play.json"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "PLAY_JSON_KEY_PATH=$RUNNER_TEMP/play.json" >> "$GITHUB_ENV"

      - name: Build play AAB
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundlePlayRelease

      - name: Verify upload signature
        run: |
          set -euo pipefail
          AAB=$(realpath "$(ls app/build/outputs/bundle/playRelease/*.aab | head -n1)")
          MAPPING=$(realpath app/build/outputs/mapping/playRelease/mapping.txt)

          CERTS=$(keytool -printcert -jarfile "$AAB")
          echo "$CERTS"
          if ! echo "$CERTS" | grep -q "SHA256: $EXPECTED_CERT_SHA256"; then
            echo "::error::AAB is not signed with the expected upload key"
            exit 1
          fi

          echo "AAB_PATH=$AAB" >> "$GITHUB_ENV"
          echo "MAPPING_PATH=$MAPPING" >> "$GITHUB_ENV"

      - name: Upload to Play (production, draft)
        run: bundle exec fastlane android play

      - name: Remove keystore and Play key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/play.json"
